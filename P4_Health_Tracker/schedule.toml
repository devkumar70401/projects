start   = "08:00"
end     = "08:30"
title   = "Wake Up, Hygiene & Morning Hydration Matrix"
repeat  = "daily"
fire_at = "start"
granular_blocks = [
    { id = "block-01-wakeup", title = "Wake Up & Out of Bed", category = "WAKE", time = "08:00 AM", detail = "Immediate rise upon alarm to trigger Cortisol Awakening Response (CAR)" },
    { id = "block-01-brush", title = "Brush Teeth", category = "ROUTINE", time = "08:05 AM", detail = "Oral hygiene and tongue cleaning to clear overnight oral microbiome" },
