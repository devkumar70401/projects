    { id = "block-01-bath", title = "Bath / Morning Shower", category = "ROUTINE", time = "08:15 AM", detail = "Invigorating shower to stimulate sympathetic alertness and dopamine" },
    { id = "block-01-water", title = "500ml Warm / Room-Temp Water", category = "HYDRATION", time = "08:20 AM", detail = "Rehydrates brain neurons and restores circulating blood volume" },
